<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  height: 100dvh;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.container {
  display: flex;
  gap: 30px;
  align-items: flex-start;
}

.game-area {
  position: relative;
}

canvas#board {
  border: 2px solid #4a4a8a;
  border-radius: 4px;
  background: #0f0f1a;
  display: block;
}

.side-panel {
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-width: 140px;
}

.panel-box {
  background: #16213e;
  border: 2px solid #4a4a8a;
  border-radius: 8px;
  padding: 16px;
  text-align: center;
}

.panel-box h3 {
  color: #8a8abf;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

canvas#next {
  display: block;
  margin: 0 auto;
  background: #0f0f1a;
  border-radius: 4px;
}

.score-value {
  color: #fff;
  font-size: 32px;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

.level-value {
  color: #e94560;
  font-size: 24px;
  font-weight: bold;
}

.lines-value {
  color: #0f3460;
  font-size: 24px;
  font-weight: bold;
}

.controls-info {
  color: #6a6a9a;
  font-size: 12px;
  line-height: 1.8;
}

.controls-info kbd {
  background: #16213e;
  border: 1px solid #4a4a8a;
  border-radius: 3px;
  padding: 2px 6px;
  font-size: 11px;
  color: #aaa;
}

.game-over-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border-radius: 4px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}

.game-over-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.game-over-overlay h2 {
  color: #e94560;
  font-size: 36px;
  margin-bottom: 16px;
}

.game-over-overlay button {
  background: #e94560;
  color: #fff;
  border: none;
  padding: 12px 32px;
  font-size: 18px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
}

.game-over-overlay button:hover {
  background: #c73a52;
}

.bottom-buttons {
  display: flex;
  gap: 8px;
}

.bottom-buttons button {
  flex: 1;
  background: #16213e;
  color: #8a8abf;
  border: 1px solid #4a4a8a;
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}

.bottom-buttons button:hover {
  background: #1f2f54;
  color: #fff;
}

/* Mobile touch controls - hidden by default */
.touch-controls {
  display: none;
}

.mobile-header { display: none; }

/* === Mobile responsive layout === */
@media (max-width: 650px), (pointer: coarse) and (max-width: 1024px) {
  body {
    align-items: stretch;
    padding: 0;
    background: #0a0a16;
  }

  .container {
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    padding: 6px 10px;
    justify-content: space-between;
  }

  /* Hide desktop sidebar entirely */
  .side-panel { display: none; }

  .game-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    flex: 1;
    justify-content: center;
    gap: 0;
  }

  /* Board container with stats overlay */
  .board-wrapper {
    position: relative;
    width: 100%;
    max-width: 320px;
    flex-shrink: 1;
  }

  canvas#board {
    display: block;
    width: 100%;
    height: auto;
    max-height: 55vh;
    max-height: 55dvh;
    border: 1px solid #2a2a5a;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(60,60,160,0.15), inset 0 0 30px rgba(0,0,0,0.3);
  }

  /* Stats bar overlaid on top of board */
  .mobile-stats {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    pointer-events: none;
    z-index: 2;
    background: linear-gradient(to bottom, rgba(10,10,22,0.9), transparent);
    border-radius: 6px 6px 0 0;
  }

  .mobile-stats .stat-item {
    text-align: center;
    min-width: 50px;
  }

  .mobile-stats .stat-label {
    font-size: 9px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    line-height: 1;
  }

  .mobile-stats .stat-val {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }

  .mobile-stats .stat-val.lvl { color: #e94560; }
  .mobile-stats .stat-val.lns { color: #5a9fd4; }

  /* Next piece mini preview overlaid on board */
  .mobile-next {
    position: absolute;
    top: 48px; right: 6px;
    background: rgba(10,10,22,0.8);
    border: 1px solid #2a2a5a;
    border-radius: 6px;
    padding: 3px;
    pointer-events: none;
    z-index: 2;
  }

  .mobile-next canvas {
    display: block;
    width: 60px;
    height: 60px;
  }

  .mobile-next .next-label {
    font-size: 8px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    margin-top: -2px;
  }

  /* Pause button overlaid top-right */
  .mobile-pause-top {
    position: absolute;
    top: 6px; right: 6px;
    width: 26px; height: 26px;
    background: rgba(10,10,22,0.7);
    border: 1px solid #3a3a6a;
    border-radius: 50%;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 3;
    -webkit-tap-highlight-color: transparent;
  }

  .mobile-pause-top:active {
    background: rgba(60,60,100,0.8);
    color: #fff;
  }

  /* === Beautiful D-Pad === */
  .touch-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px 0 12px 0;
    width: 100%;
    max-width: 400px;
  }

  .dpad {
    display: grid;
    grid-template-columns: 70px 70px 70px;
    grid-template-rows: 70px 70px;
    gap: 8px;
    justify-content: center;
  }

  .touch-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(160deg, #1a1e35 0%, #101428 100%);
    border: 1.5px solid #2e2e54;
    color: rgba(255,255,255,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform 0.08s, box-shadow 0.08s, border-color 0.08s;
    box-shadow: 0 6px 12px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative;
  }

  .touch-btn::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.08s;
    pointer-events: none;
  }

  .touch-btn:active, .touch-btn.pressed {
    transform: scale(0.88);
    border-color: #6a6abf;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5),
                0 0 24px rgba(90,90,200,0.3),
                inset 0 1px 0 rgba(255,255,255,0.06);
    color: #fff;
  }

  .touch-btn:active::after, .touch-btn.pressed::after {
    opacity: 1;
    box-shadow: inset 0 0 12px rgba(100,100,200,0.15);
  }

  .touch-btn svg {
    width: 30px;
    height: 30px;
    fill: currentColor;
    opacity: 0.7;
    pointer-events: none;
  }

  .touch-btn:active svg, .touch-btn.pressed svg {
    opacity: 1;
  }

  .btn-left  { grid-column: 1; grid-row: 2; }
  .btn-down  { grid-column: 2; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }

  /* Action buttons - slightly smaller, above d-pad */
  .btn-rotate {
    grid-column: 1; grid-row: 1;
    width: 58px; height: 58px;
    border-radius: 50%;
    align-self: center; justify-self: end;
    margin-right: 2px;
  }

  .btn-drop {
    grid-column: 3; grid-row: 1;
    width: 58px; height: 58px;
    border-radius: 50%;
    align-self: center; justify-self: start;
    margin-left: 2px;
  }

  .btn-rotate svg, .btn-drop svg {
    width: 26px; height: 26px;
  }

  .btn-pause-mobile {
    display: none; /* moved to top overlay */
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="game-area">
    <div class="board-wrapper">
      <canvas id="board"></canvas>
      <div class="mobile-stats" id="mobileStats">
        <div class="stat-item"><div class="stat-label">得分</div><div class="stat-val" id="mScore">0</div></div>
        <div class="stat-item"><div class="stat-label">等级</div><div class="stat-val lvl" id="mLevel">1</div></div>
        <div class="stat-item"><div class="stat-label">行数</div><div class="stat-val lns" id="mLines">0</div></div>
      </div>
      <div class="mobile-next">
        <div class="next-label">NEXT</div>
        <canvas id="nextMobile"></canvas>
      </div>
      <div class="mobile-pause-top" id="btnPauseTop" title="暂停">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </div>
      <div class="game-over-overlay" id="overlay">
        <h2>游戏结束</h2>
        <button onclick="restart()">重新开始</button>
      </div>
    </div>
    <div class="touch-controls" id="touchControls">
      <div class="dpad">
        <button class="touch-btn btn-rotate" id="btnRotate" title="旋转">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>
        <button class="touch-btn btn-drop" id="btnDrop" title="硬降">
          <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
        </button>
        <button class="touch-btn btn-left" id="btnLeft" title="左移">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="touch-btn btn-down" id="btnDown" title="下移">
          <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
        <button class="touch-btn btn-right" id="btnRight" title="右移">
          <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
        </button>
        <button class="touch-btn btn-pause-mobile" id="btnPauseMobile">暂停</button>
      </div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h3>下一个</h3>
      <canvas id="next"></canvas>
    </div>
    <div class="panel-box">
      <h3>得分</h3>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="panel-box">
      <h3>等级</h3>
      <div class="level-value" id="level">1</div>
    </div>
    <div class="panel-box">
      <h3>行数</h3>
      <div class="lines-value" id="lines">0</div>
    </div>
    <div class="panel-box">
      <h3>操作</h3>
      <div class="controls-info">
        <kbd>←</kbd><kbd>→</kbd> 移动<br>
        <kbd>↓</kbd> 软降<br>
        <kbd>↑</kbd> 旋转<br>
        <kbd>空格</kbd> 硬降<br>
        <kbd>P</kbd> 暂停
      </div>
    </div>
    <div class="bottom-buttons">
      <button onclick="restart()">新游戏</button>
      <button id="pauseBtn" onclick="togglePause()">暂停</button>
    </div>
  </div>
</div>

<script>
const COLS = 10;
const ROWS = 20;
const BLOCK = 30;
const COLORS = [
  null,
  '#00f0f0', // I - cyan
  '#f0f000', // O - yellow
  '#a000f0', // T - purple
  '#00f000', // S - green
  '#f00000', // Z - red
  '#0000f0', // J - blue
  '#f0a000', // L - orange
];

const SHAPES = {
  I: [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]],
  O: [[0,0,0,0],[0,2,2,0],[0,2,2,0],[0,0,0,0]],
  T: [[0,3,0],[3,3,3],[0,0,0]],
  S: [[0,4,4],[4,4,0],[0,0,0]],
  Z: [[5,5,0],[0,5,5],[0,0,0]],
  J: [[6,0,0],[6,6,6],[0,0,0]],
  L: [[0,0,7],[7,7,7],[0,0,0]],
};

const PIECE_NAMES = ['I','O','T','S','Z','J','L'];

let board, canvas, ctx, nextCanvas, nextCtx, nextMobileCanvas, nextMobileCtx;
let current, nextPiece;
let score, level, lines;
let gameRunning, paused;
let dropInterval, dropTimer;
let animationId;

canvas = document.getElementById('board');
ctx = canvas.getContext('2d');
canvas.width = COLS * BLOCK;
canvas.height = ROWS * BLOCK;

nextCanvas = document.getElementById('next');
nextCtx = nextCanvas.getContext('2d');
nextCanvas.width = 4 * BLOCK;
nextCanvas.height = 4 * BLOCK;

nextMobileCanvas = document.getElementById('nextMobile');
nextMobileCtx = nextMobileCanvas.getContext('2d');
nextMobileCanvas.width = 4 * BLOCK;
nextMobileCanvas.height = 4 * BLOCK;

function createBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(0));
}

function randomPiece() {
  const name = PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)];
  const shape = SHAPES[name].map(row => [...row]);
  return { shape, name, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
}

function rotate(shape) {
  const n = shape.length;
  const rotated = Array.from({length: n}, () => Array(n).fill(0));
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      rotated[c][n - 1 - r] = shape[r][c];
  return rotated;
}

function collides(board, shape, px, py) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const bx = px + c;
      const by = py + r;
      if (bx < 0 || bx >= COLS || by >= ROWS) return true;
      if (by >= 0 && board[by][bx]) return true;
    }
  }
  return false;
}

function lock() {
  const { shape, x, y } = current;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const by = y + r;
      if (by < 0) { gameOver(); return; }
      board[by][x + c] = shape[r][c];
    }
  }
  clearLines();
  spawn();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(cell => cell)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(0));
      cleared++;
      r++; // re-check this row
    }
  }
  if (cleared) {
    const points = [0, 100, 300, 500, 800];
    score += points[cleared] * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(50, 800 - (level - 1) * 70);
    updateUI();
  }
}

function gameOver() {
  gameRunning = false;
  document.getElementById('overlay').classList.add('active');
}

function spawn() {
  current = nextPiece;
  nextPiece = randomPiece();
  if (collides(board, current.shape, current.x, current.y)) {
    gameOver();
  }
}

function move(dx, dy) {
  if (!gameRunning || paused) return;
  const { shape, x, y } = current;
  if (!collides(board, shape, x + dx, y + dy)) {
    current.x += dx;
    current.y += dy;
  } else if (dy > 0) {
    lock();
  }
}

function hardDrop() {
  if (!gameRunning || paused) return;
  while (!collides(board, current.shape, current.x, current.y + 1)) {
    current.y++;
  }
  lock();
}

function rotatePiece() {
  if (!gameRunning || paused) return;
  const rotated = rotate(current.shape);
  const { x, y } = current;
  // Try basic rotation, then wall kicks
  const kicks = [[0,0], [-1,0], [1,0], [0,-1], [-2,0], [2,0]];
  for (const [kx, ky] of kicks) {
    if (!collides(board, rotated, x + kx, y + ky)) {
      current.shape = rotated;
      current.x += kx;
      current.y += ky;
      return;
    }
  }
}

function drawBlock(ctx, colorIdx, x, y, size) {
  if (!colorIdx) return;
  ctx.fillStyle = COLORS[colorIdx];
  ctx.fillRect(x + 1, y + 1, size - 2, size - 2);
  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x + 1, y + 1, size - 2, 4);
  ctx.fillRect(x + 1, y + 1, 4, size - 2);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x + 1, y + size - 5, size - 2, 4);
  ctx.fillRect(x + size - 5, y + 1, 4, size - 2);
}

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.strokeRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);
    }
  }
  // locked cells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawBlock(ctx, board[r][c], c * BLOCK, r * BLOCK, BLOCK);
    }
  }
  // ghost piece
  if (current && gameRunning && !paused) {
    let gy = current.y;
    while (!collides(board, current.shape, current.x, gy + 1)) gy++;
    if (gy !== current.y) {
      ctx.globalAlpha = 0.25;
      for (let r = 0; r < current.shape.length; r++) {
        for (let c = 0; c < current.shape[r].length; c++) {
          if (current.shape[r][c])
            drawBlock(ctx, current.shape[r][c], (current.x + c) * BLOCK, (gy + r) * BLOCK, BLOCK);
        }
      }
      ctx.globalAlpha = 1;
    }
  }
  // current piece
  if (current && gameRunning) {
    for (let r = 0; r < current.shape.length; r++) {
      for (let c = 0; c < current.shape[r].length; c++) {
        if (current.shape[r][c])
          drawBlock(ctx, current.shape[r][c], (current.x + c) * BLOCK, (current.y + r) * BLOCK, BLOCK);
      }
    }
  }
}

function drawNextPiece(ctx, canvas, shape) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!shape) return;
  const size = BLOCK;
  const offsetX = (canvas.width - shape[0].length * size) / 2;
  const offsetY = (canvas.height - shape.length * size) / 2;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) drawBlock(ctx, shape[r][c], offsetX + c * size, offsetY + r * size, size);
    }
  }
}

function drawNext() {
  if (nextPiece) {
    drawNextPiece(nextCtx, nextCanvas, nextPiece.shape);
    drawNextPiece(nextMobileCtx, nextMobileCanvas, nextPiece.shape);
  }
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
  const mScore = document.getElementById('mScore');
  const mLevel = document.getElementById('mLevel');
  const mLines = document.getElementById('mLines');
  if (mScore) mScore.textContent = score;
  if (mLevel) mLevel.textContent = level;
  if (mLines) mLines.textContent = lines;
}

function gameLoop(timestamp) {
  if (!gameRunning) {
    drawBoard();
    return;
  }
  if (!paused) {
    if (!dropTimer) dropTimer = timestamp;
    if (timestamp - dropTimer >= dropInterval) {
      move(0, 1);
      dropTimer = timestamp;
    }
  }
  drawBoard();
  drawNext();
  animationId = requestAnimationFrame(gameLoop);
}

function start() {
  board = createBoard();
  score = 0;
  level = 1;
  lines = 0;
  dropInterval = 800;
  gameRunning = true;
  paused = false;
  nextPiece = randomPiece();
  spawn();
  updateUI();
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('pauseBtn').textContent = '暂停';
  dropTimer = null;
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
}

function restart() {
  start();
}

function togglePause() {
  if (!gameRunning) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '继续' : '暂停';
  dropTimer = null;
}

document.addEventListener('keydown', e => {
  if (!gameRunning) {
    if (e.key === 'r' || e.key === 'R') restart();
    return;
  }
  switch (e.key) {
    case 'ArrowLeft': case 'a': case 'A': move(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': move(1, 0); e.preventDefault(); break;
    case 'ArrowDown': case 's': case 'S': move(0, 1); e.preventDefault(); break;
    case 'ArrowUp': case 'w': case 'W': rotatePiece(); e.preventDefault(); break;
    case ' ': hardDrop(); e.preventDefault(); break;
    case 'p': case 'P': togglePause(); e.preventDefault(); break;
  }
});

// Swipe on canvas
let touchStartX, touchStartY;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchend', e => {
  if (!touchStartX) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (absDx < 20 && absDy < 20) return;
  if (absDx > absDy) {
    move(dx > 0 ? 1 : -1, 0);
  } else if (dy > 40) {
    hardDrop();
  } else if (dy < -40) {
    rotatePiece();
  }
  touchStartX = null;
});

// Mobile touch buttons with long-press repeat
function setupTouchButton(id, action, allowRepeat) {
  const btn = document.getElementById(id);
  if (!btn) return;
  let repeatTimer = null;
  let initialDelay = 150;
  let repeatDelay = 50;

  function startAction(e) {
    e.preventDefault();
    if (!gameRunning || paused) return;
    action();
    if (allowRepeat) {
      initialDelay = 150;
      repeatDelay = 50;
      scheduleRepeat();
    }
  }

  function scheduleRepeat() {
    repeatTimer = setTimeout(() => {
      if (!gameRunning || paused) { stopAction(); return; }
      action();
      initialDelay = 0;
      repeatDelay = Math.max(30, repeatDelay - 2);
      scheduleRepeat();
    }, initialDelay || repeatDelay);
  }

  function stopAction(e) {
    if (e) e.preventDefault();
    if (repeatTimer) { clearTimeout(repeatTimer); repeatTimer = null; }
  }

  btn.addEventListener('touchstart', startAction, {passive: false});
  btn.addEventListener('touchend', stopAction);
  btn.addEventListener('touchcancel', stopAction);
  btn.addEventListener('mousedown', startAction);
  btn.addEventListener('mouseup', stopAction);
  btn.addEventListener('mouseleave', stopAction);
}

setupTouchButton('btnLeft',  () => move(-1, 0), true);
setupTouchButton('btnRight', () => move(1, 0), true);
setupTouchButton('btnDown',  () => move(0, 1), true);
setupTouchButton('btnRotate', () => rotatePiece(), false);
setupTouchButton('btnDrop',  () => hardDrop(), false);

document.getElementById('btnPauseMobile').addEventListener('touchstart', e => {
  e.preventDefault(); togglePause();
});
document.getElementById('btnPauseMobile').addEventListener('mousedown', e => {
  e.preventDefault(); togglePause();
});

// Update all pause buttons
const origTogglePause = togglePause;
togglePause = function() {
  origTogglePause();
  const txt = paused ? '继续' : '暂停';
  document.getElementById('pauseBtn').textContent = txt;
  const mobileBtn = document.getElementById('btnPauseMobile');
  if (mobileBtn) mobileBtn.textContent = txt;
  const topBtn = document.getElementById('btnPauseTop');
  if (topBtn) {
    topBtn.innerHTML = paused
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
  }
};

document.getElementById('btnPauseTop').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); togglePause(); });
document.getElementById('btnPauseTop').addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); togglePause(); });

start();
</script>
